<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Download & History">
    <meta name="color-scheme" content="dark light">
    <script src="./theme.js?v=2"></script>
    <title>Ryan100C's Mods</title>
    <link rel="stylesheet" href="./styles.css?v=2">
    <script src="./app.js?v=2" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a id="site-name" class="brand" href="./">Ryan100C's Mods</a>
      <div class="header-right">
        <span class="brand__mark" aria-hidden="true" data-i18n="brandMark">✦</span>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light or dark theme" data-i18n-aria-label="themeToggleLabel">
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language Selector">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-divider">/</span>
          <button type="button" class="lang-btn" data-lang="zh">中</button>
        </div>
      </div>
    </header>

    <main class="home">
      <section class="home-intro">
        <p class="eyebrow" data-i18n="homeEyebrow">MOD COLLECTION</p>
        <h1 id="page-title" data-i18n="homeTitle">Collection</h1>
        <p id="site-description" data-i18n="homeDesc">All my mods</p>
      </section>

      <section class="toolbar" aria-label="Filter mods">
        <label class="sr-only" for="search" data-i18n="searchAriaLabel">Search for mods</label>
        <input id="search" type="search" placeholder="Search by name, version, loader…" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
        <div class="toolbar-right">
          <span id="project-count" aria-live="polite"></span>
          <div class="view-toggle" role="group" aria-label="Display mode" data-i18n-aria-label="viewToggleLabel">
            <button type="button" class="view-btn" data-view="list" data-i18n="viewList">List</button>
            <button type="button" class="view-btn" data-view="grid" data-i18n="viewGrid">Grid</button>
          </div>
        </div>
      </section>

      <section id="projects" class="mod-grid mod-grid--list" aria-live="polite">
        <p class="loading" data-i18n="loadingMods">Loading mods…</p>
      </section>
    </main>

  <link rel="stylesheet" href="./__blog-theme.css" data-blog-mirror><script src="./__blog-bridge.js" data-blog-mirror></script>
</body>
</html>
