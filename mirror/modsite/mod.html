<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <script src="./theme.js?v=2"></script>
    <title>Mod Details - Ryan100C's Mods</title>
    <link rel="stylesheet" href="./styles.css?v=2">
    <script src="./mod.js?v=2" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <a id="site-name" class="brand" href="./">Ryan100C's Mods</a>
      <div class="header-right">
        <a class="back-link" id="back-link" href="./" data-i18n="backToList">← Back</a>

        </button>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language Selector">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-divider">/</span>
          <button type="button" class="lang-btn" data-lang="zh">中</button>
        </div>
      </div>
    </header>
    <main id="mod-page"><p class="loading" data-i18n="loadingModDetails">Loading mod details…</p></main>
  <link rel="stylesheet" href="./__blog-theme.css" data-blog-mirror><script src="./__blog-bridge.js" data-blog-mirror></script>
